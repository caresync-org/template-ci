# =============================================================================
# CareSync — Reusable Template: Manual Approval Gate
# File    : template-approval.yml
# Called  : directly from each microservice workflow (Job 4)
# Requires: GitHub Environment named "production" with required reviewers set
# =============================================================================
name: "CareSync Template — Manual Approval Gate"

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      full_image:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:
  approval:
    name: "✅ Awaiting Production Approval"
    runs-on: ubuntu-latest
    environment:
      name: production   # Configure required reviewers in: Repo → Settings → Environments

    steps:
      - name: Show pending deployment details
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "  ⏸  Awaiting manual approval"
          echo "  Service : caresync-${{ inputs.service_name }}"
          echo "  Image   : ${{ inputs.full_image }}"
          echo "  Tag     : ${{ inputs.image_tag }}"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Actor   : ${{ github.actor }}"
          echo "═══════════════════════════════════════════════════"

      - name: Approval confirmed
        run: echo "🟢 Approved — proceeding with production deployment."
