# =============================================================================
# MediMesh — Single Reusable CI/CD Workflow  (template-ci)
# Stages: sonarqube → install → snyk → docker-build → trivy →
#         docker-push → approval → cd → notify-success
# =============================================================================
name: MediMesh Reusable CI/CD Pipeline

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: false
        type: string
        default: "."
      docker_image_name:
        required: true
        type: string
      sonar_project_key:
        required: true
        type: string
      values_key:
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: "20"
      manifest_repo:
        required: false
        type: string
        default: "medimesh-org/argocd-manifests"
      manifest_values_path:
        required: false
        type: string
        default: "values.yaml"

    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      SNYK_TOKEN:
        required: true
      SONARQUBE_TOKEN:
        required: true
      SONARQUBE_URL:
        required: true
      MANIFEST_REPO_PAT:
        required: true
      SMTP_USERNAME:
        required: false
      SMTP_PASSWORD:
        required: false
      ALERT_EMAIL:
        required: false

    outputs:
      image_tag:
        description: "Docker image tag"
        value: ${{ jobs.docker-build.outputs.image_tag }}
      full_image:
        description: "Full image reference"
        value: ${{ jobs.docker-build.outputs.full_image }}

env:
  REGISTRY: docker.io

# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 — SonarQube Analysis
  # ---------------------------------------------------------------------------
  sonarqube:
    name: "🔍 SonarQube Analysis"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"
          cache-dependency-path: "${{ inputs.service_path }}/package-lock.json"

      - name: Install dependencies
        run: npm install

      - name: Run SonarQube Scanner
        uses: SonarSource/sonarqube-scan-action@v3
        with:
          projectBaseDir: ${{ inputs.service_path }}
          args: >
            -Dsonar.projectKey=${{ inputs.sonar_project_key }}
            -Dsonar.projectName=medimesh-${{ inputs.service_name }}
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/*.test.js,**/coverage/**
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_URL }}

      - name: "📧 Notify — SonarQube Failure"
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL }}
          from: "MediMesh CI <${{ secrets.SMTP_USERNAME }}>"
          subject: "❌ FAILED | medimesh-${{ inputs.service_name }} | SonarQube | ${{ github.ref_name }}"
          body: |
            ❌ Pipeline FAILED at: SonarQube Analysis

            Service : medimesh-${{ inputs.service_name }}
            Branch  : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Author  : ${{ github.actor }}
            Run     : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # JOB 2 — Install Dependencies
  # ---------------------------------------------------------------------------
  install:
    name: "📦 Install Dependencies"
    runs-on: ubuntu-latest
    needs: sonarqube
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"
          cache-dependency-path: "${{ inputs.service_path }}/package-lock.json"

      - name: Install dependencies
        run: npm install

      - name: Verify installed packages
        run: |
          echo "✅ Node $(node -v) | npm $(npm -v)"
          echo "📦 Packages installed: $(ls node_modules | wc -l)"

      - name: "📧 Notify — Install Failure"
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL }}
          from: "MediMesh CI <${{ secrets.SMTP_USERNAME }}>"
          subject: "❌ FAILED | medimesh-${{ inputs.service_name }} | Install | ${{ github.ref_name }}"
          body: |
            ❌ Pipeline FAILED at: Install Dependencies

            Service : medimesh-${{ inputs.service_name }}
            Branch  : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Author  : ${{ github.actor }}
            Run     : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # JOB 3 — Snyk Security Scan
  # ---------------------------------------------------------------------------
  snyk:
    name: "🛡️ Snyk Security Scan"
    runs-on: ubuntu-latest
    needs: install
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"
          cache-dependency-path: "${{ inputs.service_path }}/package-lock.json"

      - name: Install dependencies
        run: npm install

      - name: Run Snyk dependency scan
        uses: snyk/actions/node@master
        with:
          args: >
            --severity-threshold=critical
            --fail-on=all
            --project-name=medimesh-${{ inputs.service_name }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif
        continue-on-error: true

      - name: "📧 Notify — Snyk Failure"
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL }}
          from: "MediMesh CI <${{ secrets.SMTP_USERNAME }}>"
          subject: "❌ FAILED | medimesh-${{ inputs.service_name }} | Snyk | ${{ github.ref_name }}"
          body: |
            ❌ Pipeline FAILED at: Snyk Security Scan
            CRITICAL vulnerabilities found in dependencies.

            Service : medimesh-${{ inputs.service_name }}
            Branch  : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Author  : ${{ github.actor }}
            Run     : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # JOB 4 — Docker Build
  # ---------------------------------------------------------------------------
  docker-build:
    name: "🐳 Docker Build"
    runs-on: ubuntu-latest
    needs: snyk
    outputs:
      image_tag:  ${{ steps.meta.outputs.image_tag }}
      full_image: ${{ steps.meta.outputs.full_image }}
      is_pr:      ${{ steps.meta.outputs.is_pr }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: meta
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          IS_PR="false"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IS_PR="true"
            TAG="pr-${SHORT_SHA}"
          elif [ "$BRANCH" = "production" ]; then
            git fetch --tags
            LATEST=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            [ -z "$LATEST" ] && LATEST="v0.0.0"
            MAJ=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
            MIN=$(echo "$LATEST" | cut -d. -f2)
            PAT=$(echo "$LATEST" | cut -d. -f3)
            TAG="v${MAJ}.${MIN}.$((PAT+1))"
          else
            TAG="dev-${SHORT_SHA}"
          fi
          FULL="${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.docker_image_name }}:${TAG}"
          echo "image_tag=${TAG}"   >> $GITHUB_OUTPUT
          echo "full_image=${FULL}" >> $GITHUB_OUTPUT
          echo "is_pr=${IS_PR}"     >> $GITHUB_OUTPUT
          echo "📌 Tag: ${TAG} | Image: ${FULL} | PR: ${IS_PR}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.service_path }}
          file: ${{ inputs.service_path }}/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.full_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=medimesh-${{ inputs.service_name }}

      - name: Save image as tar
        run: |
          docker save "${{ steps.meta.outputs.full_image }}" | gzip > /tmp/image.tar.gz
          echo "✅ Saved $(du -sh /tmp/image.tar.gz | cut -f1)"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ inputs.service_name }}
          path: /tmp/image.tar.gz
          retention-days: 1

      - name: "📧 Notify — Docker Build Failure"
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL }}
          from: "MediMesh CI <${{ secrets.SMTP_USERNAME }}>"
          subject: "❌ FAILED | medimesh-${{ inputs.service_name }} | Docker Build | ${{ github.ref_name }}"
          body: |
            ❌ Pipeline FAILED at: Docker Build

            Service : medimesh-${{ inputs.service_name }}
            Branch  : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Author  : ${{ github.actor }}
            Run     : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # JOB 5 — Trivy Container Scan
  # ---------------------------------------------------------------------------
  trivy:
    name: "🔒 Trivy Container Scan"
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ inputs.service_name }}
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/image.tar.gz

      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.docker-build.outputs.full_image }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          timeout: "10m"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Trivy table summary
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ needs.docker-build.outputs.full_image }}
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true
          exit-code: "0"

      - name: "📧 Notify — Trivy Failure"
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL }}
          from: "MediMesh CI <${{ secrets.SMTP_USERNAME }}>"
          subject: "❌ FAILED | medimesh-${{ inputs.service_name }} | Trivy Scan | ${{ github.ref_name }}"
          body: |
            ❌ Pipeline FAILED at: Trivy Container Scan
            CRITICAL vulnerabilities found in container image.

            Service : medimesh-${{ inputs.service_name }}
            Branch  : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Author  : ${{ github.actor }}
            Run     : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # JOB 6 — Push Docker Image to Docker Hub (skipped for PRs)
  # ---------------------------------------------------------------------------
  docker-push:
    name: "🚀 Push to Docker Hub"
    runs-on: ubuntu-latest
    needs: [docker-build, trivy]
    if: needs.docker-build.outputs.is_pr == 'false'
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ inputs.service_name }}
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/image.tar.gz

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker push "${{ needs.docker-build.outputs.full_image }}"
          echo "✅ Pushed: ${{ needs.docker-build.outputs.full_image }}"

      - name: Push 'latest' tag (production only)
        if: github.ref_name == 'production'
        run: |
          LATEST="${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.docker_image_name }}:latest"
          docker tag "${{ needs.docker-build.outputs.full_image }}" "$LATEST"
          docker push "$LATEST"
          echo "✅ Pushed latest: $LATEST"

      - name: Create Git release tag (production only)
        if: github.ref_name == 'production'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MANIFEST_REPO_PAT }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   `refs/tags/${{ needs.docker-build.outputs.image_tag }}`,
              sha:   context.sha,
            });
            console.log(`✅ Git tag created: ${{ needs.docker-build.outputs.image_tag }}`);

      - name: "📧 Notify — Docker Push Failure"
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL }}
          from: "MediMesh CI <${{ secrets.SMTP_USERNAME }}>"
          subject: "❌ FAILED | medimesh-${{ inputs.service_name }} | Docker Push | ${{ github.ref_name }}"
          body: |
            ❌ Pipeline FAILED at: Docker Push

            Service : medimesh-${{ inputs.service_name }}
            Branch  : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Author  : ${{ github.actor }}
            Run     : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # JOB 7 — Manual Approval Gate (production only)
  # ---------------------------------------------------------------------------
  approval:
    name: "✅ Awaiting Production Approval"
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.ref_name == 'production' && needs.docker-build.outputs.is_pr == 'false'
    environment:
      name: production
    steps:
      - name: Approval received
        run: |
          echo "🟢 Approved — proceeding with production deployment."
          echo "   Service : medimesh-${{ inputs.service_name }}"
          echo "   Image   : ${{ needs.docker-build.outputs.full_image }}"
          echo "   Actor   : ${{ github.actor }}"

  # ---------------------------------------------------------------------------
  # JOB 8 — CD: Update ArgoCD Manifest Repo
  # ---------------------------------------------------------------------------
  cd:
    name: "🔄 CD — Update ArgoCD Manifests"
    runs-on: ubuntu-latest
    needs: [docker-build, docker-push, approval]
    if: |
      always() &&
      needs.docker-push.result == 'success' &&
      needs.docker-build.outputs.is_pr == 'false' &&
      (
        github.ref_name == 'dev' ||
        (github.ref_name == 'production' && needs.approval.result == 'success')
      )
    steps:
      - name: Clone manifest repo
        run: |
          git clone \
            "https://x-access-token:${{ secrets.MANIFEST_REPO_PAT }}@github.com/${{ inputs.manifest_repo }}.git" \
            manifest-repo

      - name: Configure Git
        run: |
          cd manifest-repo
          git config user.email "ci-bot@medimesh.io"
          git config user.name  "MediMesh CI Bot"

      - name: Update image tag in values.yaml
        run: |
          cd manifest-repo
          VALUES_FILE="${{ inputs.manifest_values_path }}"
          NEW_TAG="${{ needs.docker-build.outputs.image_tag }}"
          LAST_KEY=$(echo "${{ inputs.values_key }}" | awk -F. '{print $NF}')

          echo "📄 Before:"
          grep -n "tag:" "$VALUES_FILE" | head -10

          python3 - <<PYEOF
          import re
          key = "$LAST_KEY"
          tag = "$NEW_TAG"
          path = "$VALUES_FILE"
          with open(path) as f:
              c = f.read()
          c = re.sub(
              rf'^(\s*{re.escape(key)}:\s*)(.+)$',
              rf'\g<1>{tag}', c, count=1, flags=re.MULTILINE
          )
          with open(path, 'w') as f:
              f.write(c)
          PYEOF

          echo "📄 After:"
          grep -n "tag:" "$VALUES_FILE" | head -10

      - name: Commit and push
        run: |
          cd manifest-repo
          git add "${{ inputs.manifest_values_path }}"
          git diff --cached --quiet && {
            echo "ℹ️ No change — tag already up to date."
            exit 0
          }
          git commit -m "chore(deploy): update medimesh-${{ inputs.service_name }} → ${{ needs.docker-build.outputs.image_tag }} [ci skip]"
          git push origin HEAD
          echo "✅ Manifest updated — ArgoCD will sync."

      - name: "📧 Notify — CD Failure"
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL }}
          from: "MediMesh CI <${{ secrets.SMTP_USERNAME }}>"
          subject: "❌ FAILED | medimesh-${{ inputs.service_name }} | CD/ArgoCD | ${{ github.ref_name }}"
          body: |
            ❌ Pipeline FAILED at: CD — ArgoCD Manifest Update

            Service : medimesh-${{ inputs.service_name }}
            Branch  : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Author  : ${{ github.actor }}
            Run     : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # JOB 9 — Success Notification (runs only when ALL jobs succeed, not PRs)
  # ---------------------------------------------------------------------------
  notify-success:
    name: "📧 Pipeline Success Notification"
    runs-on: ubuntu-latest
    needs: [sonarqube, install, snyk, docker-build, trivy, docker-push, cd]
    if: success() && github.event_name != 'pull_request'
    steps:
      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL }}
          from: "MediMesh CI <${{ secrets.SMTP_USERNAME }}>"
          subject: "✅ SUCCESS | medimesh-${{ inputs.service_name }} | ${{ github.ref_name }} | Run #${{ github.run_number }}"
          html_body: |
            <html>
            <body style="font-family:Arial,sans-serif;background:#f0f0f0;padding:20px;">
              <div style="max-width:580px;margin:0 auto;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12);">
                <div style="background:#22c55e;padding:24px;text-align:center;">
                  <h1 style="color:#fff;margin:0;font-size:22px;">✅ Deployment Successful</h1>
                </div>
                <div style="padding:24px;">
                  <table style="width:100%;border-collapse:collapse;font-size:14px;">
                    <tr><td style="padding:8px;color:#666;font-weight:bold;">Service</td>
                        <td style="padding:8px;">medimesh-${{ inputs.service_name }}</td></tr>
                    <tr style="background:#f9f9f9;">
                        <td style="padding:8px;color:#666;font-weight:bold;">Docker Image</td>
                        <td style="padding:8px;font-family:monospace;">${{ needs.docker-build.outputs.full_image }}</td></tr>
                    <tr><td style="padding:8px;color:#666;font-weight:bold;">Branch</td>
                        <td style="padding:8px;">${{ github.ref_name }}</td></tr>
                    <tr style="background:#f9f9f9;">
                        <td style="padding:8px;color:#666;font-weight:bold;">Commit</td>
                        <td style="padding:8px;font-family:monospace;">${{ github.sha }}</td></tr>
                    <tr><td style="padding:8px;color:#666;font-weight:bold;">Author</td>
                        <td style="padding:8px;">${{ github.actor }}</td></tr>
                    <tr style="background:#f9f9f9;">
                        <td style="padding:8px;color:#666;font-weight:bold;">Run #</td>
                        <td style="padding:8px;">${{ github.run_number }}</td></tr>
                  </table>
                  <div style="margin-top:20px;text-align:center;">
                    <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                       style="background:#2563eb;color:#fff;padding:10px 22px;border-radius:5px;text-decoration:none;font-size:14px;">
                      View Pipeline Run →
                    </a>
                  </div>
                </div>
              </div>
            </body>
            </html>

      - name: Write Step Summary
        run: |
          echo "# ✅ Pipeline Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SonarQube Analysis  | ✅ ${{ needs.sonarqube.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Install Deps        | ✅ ${{ needs.install.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Snyk Security Scan  | ✅ ${{ needs.snyk.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build        | ✅ ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Container Scan| ✅ ${{ needs.trivy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Push         | ✅ ${{ needs.docker-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CD — ArgoCD Update  | ✅ ${{ needs.cd.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ needs.docker-build.outputs.full_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
