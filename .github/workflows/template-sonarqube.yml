# =============================================================================
# CareSync — Reusable Template: SonarQube Analysis
# File    : template-sonarqube.yml
# Called  : directly from each microservice workflow (Job 1)
# =============================================================================
name: "CareSync Template — SonarQube Analysis"

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: false
        type: string
        default: "."
      sonar_project_key:
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: "20"
    secrets:
      SONARQUBE_TOKEN:
        required: true
      SONARQUBE_URL:
        required: true
      SMTP_USERNAME:
        required: false
      SMTP_PASSWORD:
        required: false
      ALERT_EMAIL:
        required: false

jobs:
  sonarqube:
    name: "🔍 SonarQube Analysis"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"
          cache-dependency-path: "${{ inputs.service_path }}/package-lock.json"

      - name: Install dependencies
        run: npm install

      - name: Run SonarQube Scanner
        uses: SonarSource/sonarqube-scan-action@v3
        with:
          projectBaseDir: ${{ inputs.service_path }}
          args: >
            -Dsonar.projectKey=${{ inputs.sonar_project_key }}
            -Dsonar.projectName=caresync-${{ inputs.service_name }}
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/*.test.js,**/coverage/**
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt   # 👈 ADDED
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_URL }}

      - name: "📧 Notify — SonarQube Failure"
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL }}
          from: "CareSync CI <${{ secrets.SMTP_USERNAME }}>"
          subject: "❌ FAILED | caresync-${{ inputs.service_name }} | SonarQube | ${{ github.ref_name }}"
          body: |
            ❌ Pipeline FAILED at: SonarQube Analysis

            Service : caresync-${{ inputs.service_name }}
            Branch  : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Author  : ${{ github.actor }}
            Run     : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}