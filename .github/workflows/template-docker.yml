name: "CareSync Template — Docker Build, Trivy & Push"

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: false
        type: string
        default: "."
      docker_image_name:
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: "20"
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      MANIFEST_REPO_PAT:
        required: true
      SMTP_USERNAME:
        required: false
      SMTP_PASSWORD:
        required: false
      ALERT_EMAIL:
        required: false
    outputs:
      image_tag:
        description: "Computed Docker image tag"
        value: ${{ jobs.docker.outputs.image_tag }}
      full_image:
        description: "Full image reference (registry/name:tag)"
        value: ${{ jobs.docker.outputs.full_image }}
      is_pr:
        description: "'true' if triggered by a pull_request event"
        value: ${{ jobs.docker.outputs.is_pr }}

jobs:
  docker:
    name: "🐳 Docker Build, Trivy & Push"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: write

    outputs:
      image_tag:  ${{ steps.meta.outputs.image_tag }}
      full_image: ${{ steps.meta.outputs.full_image }}
      is_pr:      ${{ steps.meta.outputs.is_pr }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF_NAME}"
          IS_PR="false"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IS_PR="true"
            TAG="pr-${SHORT_SHA}"
          elif [ "$BRANCH" = "production" ]; then
            git fetch --tags
            LATEST=$(git tag --sort=-version:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            [ -z "$LATEST" ] && LATEST="v0.0.0"
            MAJ=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
            MIN=$(echo "$LATEST" | cut -d. -f2)
            PAT=$(echo "$LATEST" | cut -d. -f3)
            TAG="v${MAJ}.${MIN}.$((PAT + 1))"
          else
            TAG="dev-${SHORT_SHA}"
          fi

          FULL="${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.docker_image_name }}:${TAG}"
          echo "image_tag=${TAG}"   >> $GITHUB_OUTPUT
          echo "full_image=${FULL}" >> $GITHUB_OUTPUT
          echo "is_pr=${IS_PR}"     >> $GITHUB_OUTPUT

          echo "════════════════════════════════════════"
          echo "  Tag    : ${TAG}"
          echo "  Image  : ${FULL}"
          echo "  PR     : ${IS_PR}"
          echo "════════════════════════════════════════"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.full_image }} \
            -f ${{ inputs.service_path }}/Dockerfile \
            ${{ inputs.service_path }}
          echo "✅ Built: ${{ steps.meta.outputs.full_image }}"

      - name: Trivy — Container Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ steps.meta.outputs.full_image }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ steps.meta.outputs.full_image }}
          echo "✅ Pushed: ${{ steps.meta.outputs.full_image }}"

      - name: Push latest tag (production only)
        if: github.ref_name == 'production' && github.event_name != 'pull_request'
        run: |
          LATEST="${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.docker_image_name }}:latest"
          docker tag ${{ steps.meta.outputs.full_image }} $LATEST
          docker push $LATEST
          echo "✅ Pushed: $LATEST"

      - name: Create Git release tag (production only)
        if: github.ref_name == 'production' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MANIFEST_REPO_PAT }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   `refs/tags/${{ steps.meta.outputs.image_tag }}`,
              sha:   context.sha,
            });
            console.log(`✅ Git tag: ${{ steps.meta.outputs.image_tag }}`);

      - name: "📧 Notify — Docker Failure"
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL }}
          from: "CareSync CI <${{ secrets.SMTP_USERNAME }}>"
          subject: "❌ FAILED | caresync-${{ inputs.service_name }} | Docker | ${{ github.ref_name }}"
          body: |
            ❌ Pipeline FAILED at: Docker Build/Trivy/Push

            Service : caresync-${{ inputs.service_name }}
            Image   : ${{ steps.meta.outputs.full_image }}
            Branch  : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Author  : ${{ github.actor }}
            Run     : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
